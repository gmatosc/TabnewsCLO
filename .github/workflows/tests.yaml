name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  jest:
    name: Jest
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start Next.js and wait for API
        run: |
          npx next dev > next.log 2>&1 &
          timeout=60
          until curl --fail --silent http://127.0.0.1:3000/api/v1/status > /dev/null; do
            if [ "$timeout" -le 0 ]; then
              cat next.log
              exit 1
            fi
            sleep 1
            timeout=$((timeout - 1))
          done
          curl --fail --silent http://127.0.0.1:3000/api/v1/migrations > /dev/null
      - name: Run Jest
        run: npm test
